      summary: Reconstruct project state at specific time
      description: |
        Get project state snapshot at a specific commit or timestamp.
        Query parameters: at (ISO date), commit (SHA), limit
      operationId: getTemporalProjectState
      parameters:
        - $ref: '#/components/parameters/projectIdParam'
        - name: at
          in: query
          schema:
            type: string
            format: date-time
        - name: commit
