        **Rate Limit:** 5 requests per 15 minutes
      operationId: getProjectEvidence
      parameters:
        - $ref: '#/components/parameters/projectIdParam'
      responses:
        '200':
          description: Project evidence
          content:
            application/json:
              schema:
