      summary: Trigger GitHub pinned projects sync
      description: |
        Manually trigger synchronization of pinned GitHub projects to World Model.
        Also reindexes embeddings for semantic search.
      operationId: triggerGithubSync
      responses:
        '200':
          description: Sync completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  source:
                    type: string
                  synchronizedAt:
                    type: string
                    format: date-time
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  count:
                    type: integer
                  embeddings:
                    type: object
        '502':
          $ref: '#/components/responses/InternalServerError'

  /api/world-model/embeddings/reindex:
    post:
      tags:
        - World Model - Maintenance
      summary: Reindex embeddings
      description: Force reindexing of World Model embeddings for semantic search
      operationId: reindexEmbeddings
      responses:
        '200':
          description: Reindex completed
