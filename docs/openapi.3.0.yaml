            schema:
              $ref: '#/components/schemas/MarketingEvent'
      responses:
        '201':
          description: Event ingested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MarketingEvent'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/marketing/telemetry/events/entity/{entityType}/{entityId}:
    get:
      tags:
        - Marketing
      summary: Get entity events
      description: Get recent marketing events for a specific entity
      operationId: getEntityEvents
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [product, asset, campaign, channel, worldModelProject]
        - name: entityId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Entity events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarketingEvent'

  /api/marketing/telemetry/stats:
    get:
      tags:
        - Marketing
      summary: Get marketing event statistics
      description: Get event count statistics within time window
      operationId: getMarketingStats
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Event statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object

