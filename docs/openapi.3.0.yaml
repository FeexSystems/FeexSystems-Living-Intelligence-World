                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object

  # ============================================================================
  # WORLD MODEL - NAVIGATOR (Grounded Retrieval)
  # ============================================================================

  /api/world-model/navigator:
    get:
      tags:
        - World Model - Navigator
      summary: Navigate World Model (GET)
      description: |
        Query World Model with grounded retrieval and AI explanation.
        Returns projects, technologies, artifacts, and optional AI reasoning.
        
        **Rate Limit:** 5 requests per 15 minutes
        
        **Query Parameters:**
        - q (required): Search query
        - hybrid (optional): Use hybrid retrieval (default: true)
      operationId: navigateWorldModelGet
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            description: Search query
        - name: hybrid
          in: query
          schema:
            type: boolean
            default: true
            description: Use hybrid keyword+semantic retrieval
      responses:
        '200':
          description: Navigation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NavigatorResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'

    post:
      tags:
        - World Model - Navigator
      summary: Navigate World Model (POST with history)
      description: |
        Multi-turn World Model navigation with conversation history.
        **Rate Limit:** 5 requests per 15 minutes
      operationId: navigateWorldModelPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Search query
                hybrid:
                  type: boolean
                  default: true
                history:
                  type: array
                  items:
                    type: object
                  description: Conversation history for context
      responses:
        '200':
          description: Navigation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NavigatorResult'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /api/world-model/providers/status:
    get:
      tags:
        - World Model - Navigator
      summary: Get LLM provider status
      description: |
        Check which AI providers are configured and available.
        Used by UI to show honest warnings about AI capabilities.
        **Public access** - no authentication required.
      operationId: getLlmProviderStatus
      responses:
        '200':
          description: Provider configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      providers:
                        type: object
                        additionalProperties:
                          type: boolean
                      defaultProvider:
                        type: string

