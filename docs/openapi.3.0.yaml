  /api/world-model/omni-command:
    post:
      tags:
        - World Model - Omni-Command
      summary: Execute Omni-Command
      description: |
        Execute orchestrated commands with World Model context.
        Supports natural language queries and multi-step orchestration.
        
        **Rate Limit:** 5 requests per 15 minutes (hardQueryRateLimiter)
      operationId: executeOmniCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OmniCommandRequest'
      responses:
        '200':
          description: Command executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OmniCommandResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /api/world-model/omni-command/stream:
    post:
      tags:
        - World Model - Omni-Command
      summary: Execute Omni-Command with streaming trace
      description: |
        Execute Omni-Command with Server-Sent Events (SSE) streaming.
        Returns step-by-step reasoning trace in real-time.
        
        **Rate Limit:** 5 requests per 15 minutes
        
        **Response Format:**
        ```
        event: trace
        data: {"step": 1, "action": "..."}
        
        event: result
        data: {"status": "success", ...}
        ```
      operationId: executeOmniCommandStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OmniCommandRequest'
      responses:
        '200':
          description: Streaming command execution
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
        '429':
          $ref: '#/components/responses/RateLimitError'

