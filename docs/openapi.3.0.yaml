            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object

  /api/world-model/webhooks/provision:
    post:
      tags:
        - World Model - Maintenance
      summary: Provision GitHub webhooks
      description: Set up GitHub webhooks for World Model repositories
      operationId: provisionWebhooks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pinnedOnly:
                  type: boolean
                  default: true
                  description: Only provision for pinned repos
      responses:
        '200':
          description: Webhooks provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  callbackUrl:
                    type: string
                    format: uri
                  data:
                    type: object

  /api/world-model/webhooks/provision/{owner}/{repo}:
    post:
      tags:
        - World Model - Maintenance
      summary: Provision webhook for repository
      description: Set up webhook for specific repository
      operationId: provisionRepositoryWebhook
      parameters:
        - $ref: '#/components/parameters/ownerParam'
        - $ref: '#/components/parameters/repoParam'
      responses:
        '200':
          description: Webhook provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object

  /api/world-model/webhooks/{owner}/{repo}:
    get:
      tags:
        - World Model - Maintenance
      summary: List repository webhooks
      description: Get configured webhooks for a repository
      operationId: listRepositoryWebhooks
      parameters:
        - $ref: '#/components/parameters/ownerParam'
        - $ref: '#/components/parameters/repoParam'
      responses:
        '200':
          description: Webhooks list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array

  /api/world-model/webhook:
    post:
      tags:
        - Webhooks
      summary: GitHub webhook receiver
      description: |
        Webhook endpoint for GitHub push/webhook events.
        Verifies HMAC SHA-256 signature in x-hub-signature-256 header.
        Accepts events for default branch only.
        **Public access** - HMAC verification required instead of auth token.
      operationId: receiveGithubWebhook
      parameters:
        - name: x-hub-signature-256
          in: header
          required: true
          schema:
            type: string
            description: HMAC SHA-256 signature
        - name: x-github-event
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
      responses:
        '202':
          description: Webhook accepted (asynchronous processing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  ignored:
                    type: boolean
                  reason:
                    type: string
        '401':
          description: Invalid webhook signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string

  /api/world-model/maintenance/run:
    post:
      tags:
        - World Model - Maintenance
      summary: Run World Model maintenance
      description: Execute maintenance tasks (sync, embeddings, cleanup)
      operationId: runMaintenance
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                skipSync:
                  type: boolean
                skipEmbed:
                  type: boolean
                eventRetentionDays:
                  type: integer
      responses:
        '200':
          description: Maintenance completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object

  /api/world-model/maintenance/status:
    get:
      tags:
        - World Model - Maintenance
      summary: Get maintenance status
      description: Check if maintenance is currently running and last run details
      operationId: getMaintenanceStatus
      responses:
        '200':
          description: Maintenance status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      running:
                        type: boolean
                      lastRun:
                        type: object

