# ==============================================================================
# FEEXSYSTEMS PRODUCTION NGINX CONFIGURATION
# Domains: feexsystems.codes, api.feexsystems.codes
# Capabilities: SSL Termination (TLS 1.2/1.3), WebSocket Proxying, Security Headers,
#               Rate Limiting, and Telemetry Stream Pipeline
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Dynamic DNS Resolver for container upstream discovery
    resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=30s ipv6=off;

    # Performance & Network Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream Application Cluster
    upstream feex_backend {
        server app-prod:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

    # Global Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # SSL Global Parameters (Mozilla Intermediate Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP stapling. Uses the resolver declared at the top of http{} — nginx
    # allows only ONE `resolver` directive per block, so it is not repeated here.
    # This is a no-op when the served chain carries no OCSP URI.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # TLS material
    # --------------------------------------------------------------------------
    # Defaults point at the path docker-compose actually mounts
    # (./docker/nginx/ssl -> /etc/nginx/ssl). Let's Encrypt deployments override
    # these via the generated snippets in /etc/nginx/ssl/conf.d, which is why
    # the cert directives live in an include rather than being hardcoded here:
    # hardcoding /etc/letsencrypt/... made `nginx -t` fail on any host without
    # that exact directory, which is every non-LE environment.
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    include /etc/nginx/ssl/conf.d/*.conf;

    # ACME webroot for certbot renewals
    root /var/www/certbot;

    # --------------------------------------------------------------------------
    # 1. HTTP -> HTTPS Permanent Redirection (All Hosts)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name feexsystems.codes www.feexsystems.codes api.feexsystems.codes;

        # ACME Challenge location for Let's Encrypt renewal
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. API & Telemetry Host: api.feexsystems.codes (HTTPS / WSS)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.feexsystems.codes;

        # TLS material is inherited from the http{} block above (see the
        # /etc/nginx/ssl/conf.d override snippet mechanism).

        # Client limits
        client_max_body_size 25M;
        limit_conn addr_conn 100;

        # Real-time Telemetry Stream WebSocket
        # Terminates SSL and proxies wss://api.feexsystems.codes/telemetry/v1/stream
        location /telemetry/v1/stream {
            proxy_pass http://feex_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade protocol
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Provenance headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            # Long-lived persistent streaming options (24 hours idle before drop)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 75s;

            # Disable buffering for instantaneous telemetry frame dispatch
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # TCP fast push
            tcp_nodelay on;
        }

        # WebSocket support - Socket.io fallback
        location /socket.io/ {
            proxy_pass http://feex_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_buffering off;
        }

        # Stricter auth rate-limiting
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://feex_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # General API Endpoints
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://feex_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Health & Readiness Checks
        location ~ ^/(health|ready|ping) {
            proxy_pass http://feex_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Default fallback for API domain
        location / {
            proxy_pass http://feex_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # --------------------------------------------------------------------------
    # 3. Main Web Application Host: feexsystems.codes (HTTPS)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name feexsystems.codes www.feexsystems.codes;

        # TLS material is inherited from the http{} block above.

        # Static assets cache control (1 year immutable for Vite hashes)
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|glb|gltf|bin)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_pass http://feex_backend;
            proxy_set_header Host $host;
        }

        # SPA Routing & Root Proxy
        location / {
            proxy_pass http://feex_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
