name: Regenerate Root Lockfile

permissions:
  contents: write

on:
  push:
    branches: [refactor/world-model-registry]

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Regenerate package-lock.json from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate root package-lock from package.json"
          git push origin HEAD:refactor/world-model-registry
