name: Repair lockfile

on:
  push:
    branches:
      - refactor/world-model-registry

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: !contains(github.event.head_commit.message, '[lock-repair]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): repair package lockfile [lock-repair]"
          git push
