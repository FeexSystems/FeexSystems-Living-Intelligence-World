name: PR Title & Auto-Label

# Enforces Conventional Commits on pull-request titles and auto-applies area labels.
# Keeps the main-branch history clean when PRs are squash-merged.
#
# Title format:  <type>(<optional scope>): <description>
# Allowed types (see CONTRIBUTING.md):
#   feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
# Examples:
#   feat(world-model): add evidence provenance to graph nodes
#   fix(navigator): guard against empty retrieval results

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  title-lint:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Lint pull-request title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            is not empty and reads as an imperative summary of the change.

  auto-label:
    name: Apply area labels
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label by changed files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
          configuration-path: .github/labeler.yml
