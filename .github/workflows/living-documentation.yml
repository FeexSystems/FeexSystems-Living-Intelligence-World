name: Living Documentation Verification

permissions:
  contents: write

on:
  push:
    branches: [main, develop, refactor/world-model-registry]
  pull_request:
    branches: [main, develop]

jobs:
  gate-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck client
        run: npm run typecheck --prefix client
      - name: Build client
        run: npm run build --prefix client
      - name: Sovereign unit suite
        run: npm run test:sovereign --prefix client

  docs-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Regenerate lockfile for verification
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Persist generated lockfile
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const content = fs.readFileSync("package-lock.json", "utf8");
            const branch = process.env.GITHUB_HEAD_REF;
            const path = "package-lock.json";
            const existing = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: branch,
            });
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "chore(deps): synchronize npm lockfile [lock-repair]",
              content: Buffer.from(content).toString("base64"),
              sha: existing.data.sha,
              branch,
            });
      - name: Verify documentation, routes and assets
        run: npm run docs:verify

  world-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Regenerate lockfile for verification
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public World Model smoke matrix
        run: npx playwright test e2e/living-world-smoke.spec.ts --project=chromium
