name: Living Documentation Verification

permissions:
  contents: write

on:
  push:
    branches: [main, develop, refactor/world-model-registry]
  pull_request:
    branches: [main, develop]

jobs:
  gate-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck client
        run: npm run typecheck --prefix client
      - name: Build client
        run: npm run build --prefix client
      - name: Sovereign unit suite
        run: npm run test:sovereign --prefix client

  docs-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Regenerate lockfile for verification
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize npm lockfile [lock-repair]"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Verify documentation, routes and assets
        run: npm run docs:verify

  world-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Regenerate lockfile for verification
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public World Model smoke matrix
        run: npx playwright test e2e/living-world-smoke.spec.ts --project=chromium
