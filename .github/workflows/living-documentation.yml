name: Living Documentation Verification

permissions:
  contents: write

on:
  push:
    branches: [main, develop, refactor/world-model-registry]
  pull_request:
    branches: [main, develop]

jobs:
  gate-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Regenerate root lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify regenerated lockfile is clean
        run: git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck client
        run: npm run typecheck
      - name: Build client
        run: npm run build:client
      - name: Sovereign unit suite
        run: npx vitest run client/test/components/FeexSovereignEngine.test.tsx

  docs-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify documentation, routes and assets
        run: npm run docs:verify

  world-smoke:
    runs-on: ubuntu-24.04
    # The Playwright webServer (npm run dev) validates env at startup; mirror
    # the test.yml env block or the server exits before tests can run.
    env:
      DATABASE_URL: 'postgresql://test:test@localhost:5432/testdb'
      REDIS_URL: 'redis://localhost:6379'
      JWT_SECRET: 'test-jwt-secret-at-least-16-chars'
      JWT_REFRESH_SECRET: 'test-jwt-refresh-secret-at-least-16'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public World Model smoke matrix
        run: npx playwright test e2e/living-world-smoke.spec.ts --project=chromium
