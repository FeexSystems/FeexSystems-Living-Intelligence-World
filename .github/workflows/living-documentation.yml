name: Living Documentation Verification

permissions:
  contents: write

on:
  push:
    branches: [main, develop, refactor/world-model-registry]
  pull_request:
    branches: [main, develop]

jobs:
  gate-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck client
        run: npm run typecheck --prefix client
      - name: Build client
        run: npm run build --prefix client
      - name: Sovereign unit suite
        run: npm run test:sovereign --prefix client

  docs-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify documentation, routes and assets
        run: npm run docs:verify

  world-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public World Model smoke matrix
        run: npx playwright test e2e/living-world-smoke.spec.ts --project=chromium
