name: Deploy (Firebase)

# Automated deployment for the Firebase architecture (Hosting + Cloud Functions `api` + Data Connect).
# This mirrors scripts/deploy-firebase.sh and docs/FIREBASE_DEPLOYMENT.md. It does NOT push to Cloud Run.
#
# Release-control model (PROC-01 / docs/governance/deploy-yml-remediation-spec.md):
#   - NO push trigger. Merging to `main` never deploys.
#   - Deploys happen only via manual workflow_dispatch with an explicit
#     `release_sha` that must resolve to a commit on approved `main` history
#     whose six required checks are green (verify-release job).
#   - One concurrency group per target environment serializes ALL production
#     mutations (hosting, functions, Data Connect, Supabase).
#   - Supabase Edge Functions deploy only when `include_supabase=true`.
#
# Auth is keyless via Google Cloud Workload Identity Federation (WIF). One-time setup:
#   1. Create a GCP service account with roles: Firebase Hosting Admin, Cloud Functions Admin,
#      Cloud Datastore / Data Connect, Service Account User, Artifact Registry Writer,
#      Firebase Extensions Viewer (CLI lists extension instances on every deploy), and
#      Firebase Data Connect API Admin (roles/firebasedataconnect.admin).
#   2. Create a Workload Identity Pool + OIDC provider bound to this repo (ref refs/heads/main).
#   3. Add these repo / environment secrets:
#        WIF_PROVIDER         projects/<n>/locations/global/workloadIdentityPools/<p>/providers/<p>
#        WIF_SERVICE_ACCOUNT  the service account email granted impersonation
#      Configure WIF_PROVIDER and WIF_SERVICE_ACCOUNT for each deployment environment.
#      The staging environment must use an identity authorized for the staging project.
#   Runtime secrets (DATABASE_URL, REDIS_URL, JWT_SECRET, ENCRYPTION_KEY, SENTRY_DSN, ...)
#   are provisioned in GCP Secret Manager, NOT here.
#
# Required reviewers on the production GitHub Environment provide the manual approval gate.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      release_sha:
        description: 'Commit SHA to deploy. Must be on main history with all required checks green. Empty = dispatched ref HEAD.'
        required: false
        default: ''
        type: string
      include_supabase:
        description: 'Also deploy Supabase Edge Functions (production target only). Default OFF — one approval must not silently authorize two infrastructure surfaces.'
        required: false
        default: false
        type: boolean
      skip_functions:
        description: 'Temporarily skip Cloud Functions deploy (use while billing is suspended — hosting + dataconnect still ship)'
        required: false
        default: false
        type: boolean
      hosting_only:
        description: 'Deploy Firebase Hosting only — no functions, no Data Connect, no Supabase. Takes precedence over skip_functions. Use for frontend-only hotfixes when backend deploy dependencies (billing, dataconnect) are unavailable.'
        required: false
        default: false
        type: boolean

# Workflow default is read-only. id-token: write (Workload Identity Federation)
# is granted ONLY to the `deploy` job — no other job may mint a cloud identity
# token, and no job runs untrusted code before verify-release resolves the SHA.
permissions:
  contents: read

# One group per target environment. All deploy scopes (hosting_only, standard,
# supabase) for the same target serialize behind each other — no last-writer-wins
# overlap on the same Firebase/Supabase project. cancel-in-progress stays false:
# an in-flight deploy is never killed mid-mutation.
concurrency:
  group: deploy-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release SHA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      release_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # Dispatch-ref guard: workflow_dispatch executes the workflow file from the
      # SELECTED ref. Without this, a branch carrying a modified deploy.yml could
      # dispatch itself and bypass verification. Releases may only be cut from
      # main, whose workflow file is protected by the PR gate.
      - name: Require dispatch from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy workflow may only be dispatched on refs/heads/main (got $GITHUB_REF). A non-main ref would execute an unreviewed workflow definition."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          SHA="${INPUT_SHA:-$GITHUB_SHA}"
          echo "Candidate release SHA: $SHA"

          git fetch origin "+refs/heads/main:refs/remotes/origin/main" --quiet
          if ! git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            git fetch origin "$SHA" --quiet || true
          fi
          if ! git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            echo "::error::release_sha '$SHA' is not a reachable commit"
            exit 1
          fi
          FULL_SHA=$(git rev-parse "$SHA^{commit}")

          if ! git merge-base --is-ancestor "$FULL_SHA" origin/main; then
            echo "::error::release_sha $FULL_SHA is NOT on main history. Only commits merged through the protected PR gate may be released."
            exit 1
          fi
          echo "sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "Release SHA $FULL_SHA is on main history."

      - name: Verify required checks are green on release SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # Must mirror the required checks on the main branch protection rule.
          # lighthouse + production-smoke are intentionally excluded: both are
          # failing on main (stale Pass 10 selectors; Lighthouse PROTOCOL_TIMEOUT)
          # and are tracked for repair — a permanently-red required check
          # deadlocks the gate. See docs/governance/PROC-01-merge-control.md.
          REQUIRED="unit-tests integration-tests type-check e2e-tests"
          deadline=$((SECONDS + 900))
          while :; do
            gh api "repos/${{ github.repository }}/commits/${RELEASE_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "pending")] | @tsv' > /tmp/checks.tsv || true
            missing=""
            failed=""
            for ctx in $REQUIRED; do
              line=$(awk -F'\t' -v c="$ctx" '$1==c {print; exit}' /tmp/checks.tsv)
              if [ -z "$line" ]; then missing="$missing $ctx"; continue; fi
              status=$(echo "$line" | cut -f2); concl=$(echo "$line" | cut -f3)
              if [ "$status" != "completed" ]; then missing="$missing $ctx"; continue; fi
              if [ "$concl" != "success" ]; then failed="$failed $ctx($concl)"; fi
            done
            if [ -z "$missing" ] && [ -z "$failed" ]; then
              echo "All required checks green on $RELEASE_SHA"
              exit 0
            fi
            if [ -n "$failed" ]; then
              echo "::error::Required checks failed on $RELEASE_SHA:$failed"
              exit 1
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::Timed out waiting for required checks on $RELEASE_SHA. Missing:$missing"
              exit 1
            fi
            echo "Waiting for checks:$missing (retrying in 60s)"
            sleep 60
          done

  deploy-gate:
    name: Build & quality gate
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Unit tests import server/index.ts, which calls validateEnv() at module
    # scope. Without these, the gate fails with "Environment Validation Failed"
    # even though no real infrastructure is needed (Prisma/Redis are mocked).
    # Mirrors the env block in test.yml.
    env:
      NODE_ENV: test
      DATABASE_URL: 'postgresql://test:test@localhost:5432/testdb'
      REDIS_URL: 'redis://localhost:6379'
      JWT_SECRET: 'test-jwt-secret-at-least-32-chars-long!!'
      JWT_REFRESH_SECRET: 'test-jwt-refresh-secret-at-least-32!!'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Assert Node version (must be 22 — Vitest 5 worker pool fails on Node 24)
        run: |
          node -e "const ok = process.version.startsWith('v22.'); console.log('Node', process.version); if (!ok) { console.error('Expected Node v22.x (see .nvmrc / package.json engines)'); process.exit(1); }"

      - name: Typecheck
        run: npm run typecheck

      # Unit gate only (jsdom). `npm test` also runs the Storybook browser project, which
      # needs Playwright browsers and is covered separately in test.yml — running it here
      # would make deploys depend on browser provisioning.
      - name: Unit tests
        run: npm run test:unit

  deploy:
    name: Deploy to Firebase
    needs: [verify-release, deploy-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read    # for the pre-mutation required-checks revalidation
      id-token: write # required for Workload Identity Federation — deploy job only
    environment:
      name: ${{ inputs.target }}
      url: ${{ steps.target.outputs.hosting_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve deploy target
        id: target
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET="$INPUT_TARGET"
          else
            TARGET="production"
          fi
          case "$TARGET" in
            staging) ALIAS="staging"; PROJECT="feexsystems-staging" ;;
            *)       ALIAS="prod";    PROJECT="feexsystems-prod-508304" ;;
          esac
          if [ "$HOSTING_ONLY" = "true" ]; then
            ONLY="hosting"
            if [ "$SKIP_FUNCTIONS" = "true" ]; then
              echo "::warning::hosting_only=true AND skip_functions=true — hosting_only takes precedence; deploying hosting ONLY."
            else
              echo "::warning::hosting_only=true — deploying Firebase Hosting ONLY. Functions, Data Connect, and Supabase Edge Functions are all skipped."
            fi
          elif [ "$SKIP_FUNCTIONS" = "true" ]; then
            ONLY="hosting,dataconnect"
            echo "::warning::skip_functions=true — deploying hosting + dataconnect only (Cloud Functions gated on billing)"
          else
            ONLY="hosting,functions,dataconnect"
          fi
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "hosting_url=https://${PROJECT}.web.app" >> "$GITHUB_OUTPUT"
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "Target: $TARGET  (alias=$ALIAS project=$PROJECT only=$ONLY)"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          SKIP_FUNCTIONS: ${{ inputs.skip_functions }}
          HOSTING_ONLY: ${{ inputs.hosting_only }}

      - name: Authenticate to Google Cloud (WIF + ADC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ steps.target.outputs.project_id }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          # Generate ADC credentials for Firebase CLI authentication.
          # Keep the OAuth access token as well for the direct Cloud Functions permission probe.
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token

      # @prisma/client's postinstall is best-effort and can leave a stub client;
      # vite.config.ts bundles server code that requires generated enums (UserRole).
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build client + server
        # VITE_SOURCEMAP=false omits ~28 MB of .map files from the deployed bundle.
        # Sourcemaps are still emitted for local dev and CI (Lighthouse) builds.
        env:
          VITE_SOURCEMAP: "false"
        run: npm run build

      # Only a response that explicitly identifies a disabled/closed billing account
      # may trigger the hosting + Data Connect fallback. Other 403s (including IAM
      # PERMISSION_DENIED and SERVICE_DISABLED) fail closed.
      # Skipped when workflow_dispatch sets skip_functions=true or hosting_only=true.
      - name: Verify Cloud Functions upload permission (fail fast)
        id: verify_functions
        if: ${{ !inputs.skip_functions && !inputs.hosting_only }}
        run: |
          RESP_FILE=$(mktemp)
          HTTP_CODE=$(curl -s -w "%{http_code}" -o "$RESP_FILE" \
            -X POST "https://cloudfunctions.googleapis.com/v2/projects/${{ steps.target.outputs.project_id }}/locations/us-central1/functions:generateUploadUrl" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP code: $HTTP_CODE"
          echo "Response body:"
          cat "$RESP_FILE" || true
          echo ""
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Cloud Functions upload permission OK"
          elif [ "$HTTP_CODE" = "403" ]; then
            ERROR_MESSAGE="$(jq -r '.error.message // empty' "$RESP_FILE" 2>/dev/null || true)"
            ERROR_REASONS="$(jq -r '[.error.details[]?.reason // empty] | join(" ")' "$RESP_FILE" 2>/dev/null || true)"
            BILLING_EVIDENCE="$(printf '%s\n%s\n' "$ERROR_MESSAGE" "$ERROR_REASONS")"
            if printf '%s' "$BILLING_EVIDENCE" | grep -Eiq 'BILLING_DISABLED|billing.{0,100}(disabled|closed|suspended|inactive|not active)|(disabled|closed|suspended|inactive|not active).{0,100}billing'; then
              echo "::warning::Cloud Functions upload denied because the API response identifies a billing restriction. Falling back to hosting + Data Connect only; the api function will NOT be updated this run."
              echo "only=hosting,dataconnect" >> "$GITHUB_OUTPUT"
              {
                echo "### ⚠️ Cloud Functions skipped (billing restriction)"
                echo "The Cloud Functions upload probe explicitly identified a billing restriction for \`${{ steps.target.outputs.project_id }}\`. The api function was not deployed. Resolve billing, then re-run a full deploy."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Cloud Functions upload returned HTTP 403 without explicit billing evidence. Refusing partial deployment. Inspect the API error above for IAM, API enablement, or organization-policy causes."
              exit 1
            fi
          else
            echo "::error::functions:generateUploadUrl returned HTTP $HTTP_CODE (expected 200). Full body above."
            exit 1
          fi

      # N5 revalidation: verify-release ran at the start of the pipeline; checks
      # are re-asserted immediately before any infrastructure mutation so a
      # stale or superseded release cannot deploy on outdated evidence.
      - name: Revalidate required checks before mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          REQUIRED="unit-tests integration-tests type-check e2e-tests"
          gh api "repos/${{ github.repository }}/commits/${RELEASE_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, .status, (.conclusion // "pending")] | @tsv' > /tmp/checks-final.tsv
          bad=""
          for ctx in $REQUIRED; do
            line=$(awk -F'\t' -v c="$ctx" '$1==c {print; exit}' /tmp/checks-final.tsv)
            status=$(echo "$line" | cut -f2); concl=$(echo "$line" | cut -f3)
            if [ "$status" != "completed" ] || [ "$concl" != "success" ]; then
              bad="$bad $ctx(${concl:-missing})"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::Required checks no longer green on $RELEASE_SHA:$bad — aborting before mutation"
            exit 1
          fi
          echo "Required checks re-verified green on $RELEASE_SHA"

      # Canonical project ID (not the .firebaserc alias). Component list prefers the
      # probe's override (set only for an explicit billing restriction) and falls back
      # to the target step's precomputed list when the probe was skipped.
      - name: Deploy Hosting + Functions + Data Connect
        run: npx firebase deploy --non-interactive --project "$PROJECT_ID" --only "$DEPLOY_COMPONENTS"
        env:
          PROJECT_ID: ${{ steps.target.outputs.project_id }}
          DEPLOY_COMPONENTS: ${{ steps.verify_functions.outputs.only || steps.target.outputs.only }}
          GOOGLE_CLOUD_PROJECT: ${{ steps.target.outputs.project_id }}

      - name: Health check (Hosting + api function)
        run: |
          echo "Hosting: $HOSTING_URL"
          curl -fsS --retry 5 --retry-delay 5 "$HOSTING_URL" -o /dev/null
          case ",$ONLY," in
            *,functions,*)
              curl -fsS --retry 5 --retry-delay 5 \
                "https://us-central1-$PROJECT_ID.cloudfunctions.net/api/ping"
              ;;
            *)
              echo "Functions not included in this deploy (only=$ONLY); skipping /api/ping check"
              ;;
          esac
          {
            echo "### Firebase deployment verified"
            echo "- Release SHA: \`${{ needs.verify-release.outputs.release_sha }}\`"
            echo "- Project: \`$PROJECT_ID\`"
            echo "- Components: \`$ONLY\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          HOSTING_URL: ${{ steps.target.outputs.hosting_url }}
          PROJECT_ID: ${{ steps.target.outputs.project_id }}
          ONLY: ${{ steps.verify_functions.outputs.only || steps.target.outputs.only }}

  deploy-supabase-functions:
    name: Deploy Supabase Edge Functions
    needs: [verify-release, deploy-gate]
    runs-on: ubuntu-latest
    # Supabase is an explicit per-release opt-in (include_supabase) and only ever
    # targets production. A staging dispatch or default run must never touch it.
    if: >-
      inputs.include_supabase == true &&
      inputs.target == 'production' &&
      !inputs.hosting_only
    environment:
      name: production
    permissions:
      contents: read
      checks: read # for the pre-mutation required-checks revalidation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.release_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Revalidate required checks before mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          REQUIRED="unit-tests integration-tests type-check e2e-tests"
          gh api "repos/${{ github.repository }}/commits/${RELEASE_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, .status, (.conclusion // "pending")] | @tsv' > /tmp/checks-final.tsv
          bad=""
          for ctx in $REQUIRED; do
            line=$(awk -F'\t' -v c="$ctx" '$1==c {print; exit}' /tmp/checks-final.tsv)
            status=$(echo "$line" | cut -f2); concl=$(echo "$line" | cut -f3)
            if [ "$status" != "completed" ] || [ "$concl" != "success" ]; then
              bad="$bad $ctx(${concl:-missing})"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::Required checks no longer green on $RELEASE_SHA:$bad — aborting before mutation"
            exit 1
          fi
          echo "Required checks re-verified green on $RELEASE_SHA"

      - name: Deploy Edge Functions
        run: supabase functions deploy api --remote="$PROJECT_ID" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: anzhoagofbebgojbidxu

      - name: Post-deployment health check
        run: |
          echo "Checking https://$PROJECT_ID.functions.supabase.co/api/ping"
          curl -fsS --retry 5 --retry-delay 5 \
            "https://$PROJECT_ID.functions.supabase.co/api/ping"
          {
            echo "### Supabase Edge Function deployment verified"
            echo "- Release SHA: \`${{ needs.verify-release.outputs.release_sha }}\`"
            echo "- Project: \`$PROJECT_ID\`"
            echo "- Function: \`api\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PROJECT_ID: anzhoagofbebgojbidxu
