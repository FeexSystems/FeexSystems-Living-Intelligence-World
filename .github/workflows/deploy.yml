name: Deploy (Firebase)

# Automated deployment for the Firebase architecture (Hosting + Cloud Functions `api` + Data Connect).
# This mirrors scripts/deploy-firebase.sh and docs/FIREBASE_DEPLOYMENT.md. It does NOT push to Cloud Run.
#
# Auth is keyless via Google Cloud Workload Identity Federation (WIF). One-time setup:
#   1. Create a GCP service account with roles: Firebase Hosting Admin, Cloud Functions Admin,
#      Cloud Datastore / Data Connect, Service Account User, Artifact Registry Writer,
#      Firebase Extensions Viewer (CLI lists extension instances on every deploy), and
#      Firebase Data Connect API Admin (roles/firebasedataconnect.admin).
#   2. Create a Workload Identity Pool + OIDC provider bound to this repo (ref refs/heads/main).
#   3. Add these repo / environment secrets:
#        GCP_PROJECT_ID       e.g. feexsystems-prod-508304
#        WIF_PROVIDER         projects/<n>/locations/global/workloadIdentityPools/<p>/providers/<p>
#        WIF_SERVICE_ACCOUNT  the service account email granted impersonation
#   Runtime secrets (DATABASE_URL, REDIS_URL, JWT_SECRET, ENCRYPTION_KEY, SENTRY_DSN, ...) are
#   provisioned in GCP Secret Manager, NOT here.
#
# Recommended: add required reviewers to the `production` GitHub Environment for a manual approval gate.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_functions:
        description: 'Temporarily skip Cloud Functions deploy (use while billing is suspended — hosting + dataconnect still ship)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

# Never run two deploys for the same ref at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-gate:
    name: Build & quality gate
    runs-on: ubuntu-latest
    # Unit tests import server/index.ts, which calls validateEnv() at module
    # scope. Without these, the gate fails with "Environment Validation Failed"
    # even though no real infrastructure is needed (Prisma/Redis are mocked).
    # Mirrors the env block in test.yml.
    env:
      NODE_ENV: test
      DATABASE_URL: 'postgresql://test:test@localhost:5432/testdb'
      REDIS_URL: 'redis://localhost:6379'
      JWT_SECRET: 'test-jwt-secret-at-least-32-chars-long!!'
      JWT_REFRESH_SECRET: 'test-jwt-refresh-secret-at-least-32!!'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Assert Node version (must be 22 — Vitest 5 worker pool fails on Node 24)
        run: |
          node -e "const ok = process.version.startsWith('v22.'); console.log('Node', process.version); if (!ok) { console.error('Expected Node v22.x (see .nvmrc / package.json engines)'); process.exit(1); }"

      - name: Typecheck
        run: npm run typecheck

      # Unit gate only (jsdom). `npm test` also runs the Storybook browser project, which
      # needs Playwright browsers and is covered separately in test.yml — running it here
      # would make deploys depend on browser provisioning.
      - name: Unit tests
        run: npm run test:unit

  deploy:
    name: Deploy to Firebase
    needs: deploy-gate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'production' }}
      url: ${{ steps.target.outputs.hosting_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve deploy target
        id: target
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET="$INPUT_TARGET"
          else
            TARGET="production"
          fi
          case "$TARGET" in
            staging) ALIAS="staging"; PROJECT="feexsystems-staging" ;;
            *)       ALIAS="prod";    PROJECT="feexsystems-prod-508304" ;;
          esac
          if [ "$SKIP_FUNCTIONS" = "true" ]; then
            ONLY="hosting,dataconnect"
            echo "::warning::skip_functions=true — deploying hosting + dataconnect only (Cloud Functions gated on billing)"
          else
            ONLY="hosting,functions,dataconnect"
          fi
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "hosting_url=https://${PROJECT}.web.app" >> "$GITHUB_OUTPUT"
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "Target: $TARGET  (alias=$ALIAS project=$PROJECT only=$ONLY)"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          SKIP_FUNCTIONS: ${{ inputs.skip_functions }}

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          # Mint a GCP OAuth access token for the impersonated SA. The
          # Firebase CLI does not pick up ADC (GOOGLE_APPLICATION_CREDENTIALS)
          # on its own in CI — it requires either `firebase login` or a
          # Bearer token via FIREBASE_TOKEN / --token. Wiring the WIF access
          # token through keeps the deploy keyless (no JSON keys).
          token_format: access_token

      - name: Build client + server
        run: npm run build

      # Fail fast on unexpected errors; on a billing 403, fall back to hosting+dataconnect
      # so static/dataconnect changes still ship while billing is resolved (loud warning).
      # A 403 here ("Write access ... check billing account") means the project's
      # billing account is CLOSED/SUSPENDED — it hits project Owners too, so no IAM
      # grant can fix it; see https://console.cloud.google.com/billing.
      # Skipped when workflow_dispatch sets skip_functions=true (billing workaround).
      - name: Verify Cloud Functions upload permission (fail fast)
        id: verify_functions
        if: ${{ !inputs.skip_functions }}
        run: |
          RESP_FILE=$(mktemp)
          HTTP_CODE=$(curl -s -w "%{http_code}" -o "$RESP_FILE" \
            -X POST "https://cloudfunctions.googleapis.com/v2/projects/${{ steps.target.outputs.project_id }}/locations/us-central1/functions:generateUploadUrl" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP code: $HTTP_CODE"
          echo "Response body:"
          cat "$RESP_FILE" || true
          echo ""
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Cloud Functions upload permission OK"
          elif [ "$HTTP_CODE" = "403" ]; then
            echo "::warning::functions:generateUploadUrl returned HTTP 403 — billing account closed/suspended (https://console.cloud.google.com/billing). Falling back to hosting+dataconnect only; the api function will NOT be updated this run."
            echo "only=hosting,dataconnect" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ Cloud Functions skipped (billing 403)"
              echo "Billing gate on \`${{ steps.target.outputs.project_id }}\` returned 403 — the api function was not deployed this run. Fix billing, then re-run a full deploy."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::functions:generateUploadUrl returned HTTP $HTTP_CODE (expected 200). Full body above."
            exit 1
          fi

      # Canonical project ID (not the .firebaserc alias). Component list prefers the
      # probe's override (set on billing 403) and falls back to the target step's
      # precomputed list when the probe was skipped (empty output is falsy in GH expressions).
      - name: Deploy Hosting + Functions + Data Connect
        run: npx firebase deploy --non-interactive --project "${{ steps.target.outputs.project_id }}" --only "${{ steps.verify_functions.outputs.only || steps.target.outputs.only }}"
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_CLOUD_PROJECT: ${{ steps.target.outputs.project_id }}

      - name: Health check (Hosting + api function)
        run: |
          echo "Hosting: ${{ steps.target.outputs.hosting_url }}"
          curl -fsS --retry 5 --retry-delay 5 "${{ steps.target.outputs.hosting_url }}" -o /dev/null
          case ",$ONLY," in
            *,functions,*)
              curl -fsS --retry 5 --retry-delay 5 \
                "https://us-central1-${{ steps.target.outputs.project_id }}.cloudfunctions.net/api/ping"
              ;;
            *)
              echo "Functions not included in this deploy (only=$ONLY); skipping /api/ping check"
              ;;
          esac
        env:
          HOSTING_URL: ${{ steps.target.outputs.hosting_url }}
          PROJECT_ID: ${{ steps.target.outputs.project_id }}
          ONLY: ${{ steps.verify_functions.outputs.only || steps.target.outputs.only }}
