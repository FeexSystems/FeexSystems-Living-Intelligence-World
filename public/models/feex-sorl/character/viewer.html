<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FEEX Character — Tripo candidate (rigged)</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  body { margin:0; background:#0a0a0a; height:100vh; }
  model-viewer { width:100%; height:100%; }
</style>
</head>
<body>
<model-viewer src="feex-character-rigged.glb"
  camera-controls auto-rotate auto-rotate-delay="1500" rotation-per-second="12"
  shadow-intensity="1" environment-image="neutral" exposure="1.1"
  camera-orbit="0deg 80deg 3m" min-camera-orbit="auto 0deg 1m" max-camera-orbit="auto 180deg 8m">
</model-viewer>
</body>
</html>
