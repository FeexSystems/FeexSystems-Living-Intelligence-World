[build]
  command = "npm run build:client"
  publish = "dist/spa"

# Ensure all routes fall back to index.html for SPA routing (Dual Mode Routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Strict cache control for Vite's hashed static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
